<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Cronograma de 25 dias de preparacao para processos seletivos: algoritmos, live coding, entrevista tecnica e treino comportamental (pitch, historias STAR e perguntas).">
<meta name="theme-color" content="#0C6D7C" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A1113" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Treino Entrevistas">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<title>Treino de Entrevistas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#F1F5F6; --surface:#FFFFFF; --surface-2:#E7EFF0; --ink:#0F1A1D; --muted:#55686E;
  --line:#D5E0E2; --line-2:#C2D2D5;
  --accent:#0C6D7C; --accent-ink:#FFFFFF; --accent-soft:#D6EDF1;
  --today:#B85C0A; --today-soft:#FAEBD7;
  --done:#0E7263; --done-soft:#D6EFE9;
  --rest:#6B7B80;
  --shadow:0 1px 2px rgba(15,26,29,.06), 0 8px 24px -12px rgba(15,26,29,.18);
  --radius:10px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0A1113; --surface:#111C1F; --surface-2:#17272B; --ink:#E3EDEF; --muted:#8DA4AA;
    --line:#213840; --line-2:#2C4952;
    --accent:#54C4D6; --accent-ink:#04252B; --accent-soft:#0D2B32;
    --today:#F0A44E; --today-soft:#33220E;
    --done:#4FD0B4; --done-soft:#0C2B27;
    --rest:#7A8F95;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 30px -14px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1113; --surface:#111C1F; --surface-2:#17272B; --ink:#E3EDEF; --muted:#8DA4AA;
  --line:#213840; --line-2:#2C4952;
  --accent:#54C4D6; --accent-ink:#04252B; --accent-soft:#0D2B32;
  --today:#F0A44E; --today-soft:#33220E;
  --done:#4FD0B4; --done-soft:#0C2B27;
  --rest:#7A8F95;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 30px -14px rgba(0,0,0,.7);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,sans-serif;
  font-size:15px; line-height:1.55; -webkit-text-size-adjust:100%;
}
h1,h2,h3{font-family:"Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif;margin:0;text-wrap:balance;letter-spacing:-.015em}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
a{color:var(--accent);text-underline-offset:2px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.shell{max-width:1180px;margin:0 auto;padding:0 18px 72px}
header.top{
  position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 86%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);margin:0 -18px 20px;padding:14px 18px 0;
}
.top-row{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap}
.brand h1{font-size:1.32rem;font-weight:800}
.brand p{margin:2px 0 0;color:var(--muted);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase}
.top-right{margin-left:auto;display:flex;align-items:center;gap:14px}
.meter{min-width:190px}
.meter-head{display:flex;justify-content:space-between;font-size:.74rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:5px}
.bar{height:7px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.bar span{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .35s ease}
.icon-btn{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink);text-decoration:none}
.icon-btn:hover{border-color:var(--line-2)}
nav.tabs{display:flex;gap:2px;margin-top:12px;overflow-x:auto}
nav.tabs button{
  padding:9px 14px;font-size:.86rem;font-weight:600;color:var(--muted);white-space:nowrap;
  border-bottom:2px solid transparent;margin-bottom:-1px;
}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

/* ---------- layout ---------- */
.cols{display:grid;grid-template-columns:250px minmax(0,1fr);gap:26px;align-items:start}
@media (max-width:860px){.cols{grid-template-columns:1fr;gap:16px}}

/* ---------- rail ---------- */
.rail{position:sticky;top:112px;max-height:calc(100vh - 132px);overflow-y:auto;padding-right:4px}
@media (max-width:860px){.rail{position:static;max-height:none;overflow:visible}}
.week{margin-bottom:16px}
.week-title{display:flex;align-items:baseline;gap:8px;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.week-title b{color:var(--ink);font-weight:600}
.week-count{margin-left:auto;font-size:.7rem}
.dayrow{
  display:flex;align-items:center;gap:10px;width:100%;padding:7px 9px;border-radius:8px;text-align:left;
  border:1px solid transparent;
}
.dayrow:hover{background:var(--surface)}
.dayrow[aria-current="true"]{background:var(--surface);border-color:var(--line-2);box-shadow:var(--shadow)}
.dayrow .num{font-size:.72rem;color:var(--muted);width:5ch;flex:none;white-space:nowrap}
.dayrow .lbl{font-size:.85rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dayrow.is-rest .lbl{color:var(--rest)}
.dot{width:9px;height:9px;border-radius:50%;flex:none;border:1.5px solid var(--line-2);background:transparent}
.dot.done{background:var(--done);border-color:var(--done)}
.dot.today{border-color:var(--today);background:var(--today);box-shadow:0 0 0 3px var(--today-soft)}
.dot.sim{border-radius:2px;transform:rotate(45deg)}
@media (max-width:860px){
  .rail{display:flex;gap:14px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch}
  .week{margin:0;flex:none}
  .week .days{display:flex;gap:6px}
  .dayrow{flex-direction:column;gap:5px;width:58px;padding:8px 4px;border:1px solid var(--line);background:var(--surface)}
  .dayrow .lbl{display:none}
  .dayrow .num{width:auto;font-size:.78rem;color:var(--ink)}
}

/* ---------- day card ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.day-head{padding:20px 22px 18px;border-bottom:1px solid var(--line);display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
.day-head .date{font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.day-head h2{font-size:1.55rem;font-weight:700;margin-top:3px}
.tagline{color:var(--muted);margin:6px 0 0;max-width:62ch}
.pill{
  display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;
  font-size:.72rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
  background:var(--surface-2);color:var(--muted);border:1px solid var(--line)
}
.pill.sim{background:var(--today-soft);color:var(--today);border-color:transparent}
.pill.rest{background:transparent}
.pill.done{background:var(--done-soft);color:var(--done);border-color:transparent}
.head-actions{margin-left:auto;display:flex;gap:10px;align-items:center}
.btn{
  padding:9px 15px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);
  font-weight:600;font-size:.85rem
}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.primary:hover{filter:brightness(1.07)}
.day-body{padding:6px 22px 22px}
section.block{padding:18px 0;border-bottom:1px dashed var(--line)}
section.block:last-child{border-bottom:none}
.block-title{display:flex;align-items:center;gap:9px;font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.block-title .rule{flex:1;height:1px;background:var(--line)}
.goal{
  display:flex;gap:12px;padding:13px 15px;border-radius:8px;background:var(--accent-soft);
  border-left:3px solid var(--accent)
}
.goal p{margin:0}
.goal .k{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:2px}
.book{display:flex;gap:10px;align-items:baseline;color:var(--muted);font-size:.92rem}
.book b{color:var(--ink);font-weight:600}

/* exercises */
ul.ex{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
ul.ex li{display:flex;align-items:flex-start;gap:11px;padding:8px 10px;border-radius:8px}
ul.ex li:hover{background:var(--surface-2)}
.cb{
  appearance:none;width:18px;height:18px;flex:none;margin-top:2px;border-radius:5px;
  border:1.5px solid var(--line-2);background:var(--surface);cursor:pointer;position:relative
}
.cb:checked{background:var(--done);border-color:var(--done)}
.cb:checked::after{
  content:"";position:absolute;left:5.5px;top:2px;width:4px;height:9px;
  border:solid #fff;border-width:0 2px 2px 0;transform:rotate(42deg)
}
.ex-main{min-width:0;flex:1}
.ex-t{display:block}
li.checked .ex-t{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line-2)}
.ex-meta{font-size:.74rem;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:1px}
.src{font-size:.64rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;padding:1px 6px;border-radius:4px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.src.lc{color:var(--today);background:var(--today-soft);border-color:transparent}
.src.doc{color:var(--accent);background:var(--accent-soft);border-color:transparent}

/* questions */
ol.qs{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:7px;color:var(--ink)}
ol.qs li{padding-left:4px}
ol.qs li::marker{color:var(--muted);font-family:"JetBrains Mono",monospace;font-size:.8rem}

/* notes */
textarea{
  width:100%;min-height:110px;resize:vertical;padding:12px 14px;border-radius:8px;
  border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:.92rem
}
textarea::placeholder{color:var(--muted)}
.save-hint{font-size:.74rem;color:var(--muted);margin-top:6px;height:1em}

/* timer */
.timer{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:16px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line)}
.clock{font-family:"JetBrains Mono",monospace;font-size:2.6rem;font-weight:700;letter-spacing:-.02em;line-height:1}
.clock.warn{color:var(--today)}
.clock.over{color:#D64545}
.presets{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:5px 11px;border-radius:99px;border:1px solid var(--line-2);font-size:.78rem;font-weight:600;background:var(--surface)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:transparent}

/* checklist view */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow)}
.panel h3{font-size:1.02rem;margin-bottom:4px}
.panel .sub{color:var(--muted);font-size:.8rem;margin:0 0 12px}
.tick{display:flex;align-items:center;gap:10px;padding:6px 4px;border-radius:6px}
.tick:hover{background:var(--surface-2)}
.tick span{font-size:.92rem}
.tick.on span{color:var(--muted)}
.res-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.res-list a{display:block;font-weight:600;text-decoration:none}
.res-list a:hover{text-decoration:underline}
.res-list p{margin:1px 0 0;font-size:.82rem;color:var(--muted)}
.note-strip{margin-top:26px;font-size:.8rem;color:var(--muted);text-align:center}
.sync{font-size:.72rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--line-2);display:block}
.sync.on i{background:var(--done)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<style>
.foot{margin-top:30px;padding-top:20px;border-top:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:12px}
.foot-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.sync{margin:0}
.sync.off i{background:var(--today)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);
  padding:10px 18px;border-radius:99px;font-size:.86rem;font-weight:600;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
/* ---------- soft skills ---------- */
.src.rec{color:var(--done);background:var(--done-soft);border-color:transparent}
.goal.alt{background:var(--today-soft);border-left-color:var(--today)}
.goal.alt .k{color:var(--today)}
.goal + ul.ex{margin-top:12px}
.soft-head{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;margin-bottom:18px}
.soft-head h2{font-size:1.3rem}
.soft-head p{margin:4px 0 0;color:var(--muted);font-size:.86rem;max-width:62ch}
.soft-head .meter{margin-left:auto;min-width:200px}
.stack{display:flex;flex-direction:column;gap:16px}
.field{margin-bottom:14px}
.field:last-child{margin-bottom:0}
.field label{display:block;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:3px}
.field .hint{margin:0 0 6px;font-size:.8rem;color:var(--muted)}
.field textarea{min-height:74px}
.wc{margin-top:4px;font-size:.74rem;color:var(--muted);min-height:1em}
.wc.over{color:var(--today);font-weight:600}
.star-item{border:1px solid var(--line);border-radius:8px;margin-bottom:8px;background:var(--bg)}
.star-sum{display:flex;align-items:center;gap:10px;padding:11px 13px;font-size:.92rem;font-weight:600;cursor:pointer;list-style:none;border-radius:8px}
.star-sum::-webkit-details-marker{display:none}
.star-sum:hover{background:var(--surface-2)}
.star-sum .arrow{color:var(--muted);font-size:.6rem;transition:transform .18s ease}
.star-item[open] > .star-sum .arrow{transform:rotate(90deg)}
.star-sum .badge{margin-left:auto;flex:none;font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;
  padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.star-sum .badge.on{background:var(--done-soft);color:var(--done);border-color:transparent}
.star-body{padding:14px 13px;border-top:1px solid var(--line)}
.tick.q{align-items:flex-start}
.tick.q .cb{margin-top:3px}
.askd{display:block;margin-top:1px;font-size:.8rem;color:var(--muted)}
.drill{padding:16px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);margin-bottom:8px}
.drill-q{display:flex;align-items:center;min-height:3em;font-size:1rem;font-weight:600;line-height:1.45}
.drill-q.idle{font-size:.88rem;font-weight:400;color:var(--muted)}
.drill-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.drill-row .clock{font-size:1.6rem;margin-left:auto}
.qcat{margin:18px 0 3px;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.panel .qcat:first-of-type{margin-top:4px}
</style>
</head>
<body>


<div class="shell">
  <header class="top">
    <div class="top-row">
      <div class="brand">
        <h1>Stride - Treino de Entrevistas</h1>
        <p>01/09 → 25/09 · Coderbyte, live coding e entrevista</p>
      </div>
      <div class="top-right">
        <div class="meter">
          <div class="meter-head"><span>Progresso</span><span class="mono" id="mProg">0/25</span></div>
          <div class="bar"><span id="mBar" style="width:0%"></span></div>
        </div>
        <button class="icon-btn" id="themeBtn" title="Alternar tema" aria-label="Alternar tema">◐</button>
      </div>
    </div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-view="trilha" aria-selected="true">Trilha</button>
      <button role="tab" data-view="soft" aria-selected="false">Soft skills</button>
      <button role="tab" data-view="checklist" aria-selected="false">Checklist</button>
      <button role="tab" data-view="recursos" aria-selected="false">Recursos</button>
    </nav>
  </header>

  <div id="viewTrilha">
    <div class="cols">
      <aside class="rail" id="rail"></aside>
      <main id="dayPane"></main>
    </div>
  </div>

  <div id="viewSoft" hidden></div>
  <div id="viewChecklist" hidden></div>
  <div id="viewRecursos" hidden></div>

  <footer class="foot">
    <div class="foot-actions">
      <button class="btn primary" id="installBtn" hidden>Instalar app</button>
      <button class="btn" id="exportBtn">Exportar progresso</button>
      <button class="btn" id="importBtn">Importar progresso</button>
      <input type="file" id="importFile" accept="application/json" hidden>
      <a class="icon-btn" href="https://github.com/Devgusta5/Stride" target="_blank" rel="noopener" title="Código no GitHub" aria-label="Código no GitHub">
        <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
      </a>
    </div>
    <p class="sync" id="sync"><i></i><span id="syncTxt">progresso salvo neste dispositivo · funciona offline</span></p>
  </footer>
</div>

<script>
const LC = s => "https://leetcode.com/problems/" + s + "/";
const DIAS = [
 {d:1,date:"2026-09-01",wd:"terça",week:1,title:"Arrays + Big O",
  tag:"Reconhecer O(1), O(log n), O(n) e O(n²) olhando para o loop, não decorando tabela.",
  book:"Cap. 1 — Introdução aos algoritmos",prio:"🔴 prioridade altíssima",
  ex:[{t:"Two Sum",u:LC("two-sum"),s:"lc",m:"força bruta primeiro, depois otimize"},
      {t:"Running Sum of 1d Array",u:LC("running-sum-of-1d-array"),s:"lc"},
      {t:"Contains Duplicate",u:LC("contains-duplicate"),s:"lc",m:"compare O(n²) vs Set"},
      {t:"Best Time to Buy and Sell Stock",u:LC("best-time-to-buy-and-sell-stock"),s:"lc"},
      {t:"Big-O Cheat Sheet — leitura de 10 min",u:"https://www.bigocheatsheet.com/",s:"doc"},
      {t:"MDN — Array (métodos e custo)",u:"https://developer.mozilla.org/pt-BR/docs/Web/JavaScript/Reference/Global_Objects/Array",s:"doc"}],
  qs:["Qual a complexidade de tempo e de espaço da sua solução?",
      "Por que dois loops aninhados viram O(n²)?",
      "O que muda se o array estiver ordenado?"]},

 {d:2,date:"2026-09-02",wd:"quarta",week:1,title:"Hash Map, Object e Set",
  tag:"Entender por que lookup O(1) derruba um O(n²) para O(n).",
  book:"Cap. 5 — Tabelas hash",prio:"🔴 prioridade altíssima",
  ex:[{t:"Two Sum (agora com Map)",u:LC("two-sum"),s:"lc",m:"uma passada só"},
      {t:"Valid Anagram",u:LC("valid-anagram"),s:"lc"},

/* ---------- estado ---------- */
const KEY="treino-entrevistas-v1";
const KEYS=["done","ex","notes","chk","soft","pitch","star","beh","ask"];
let S={done:{},ex:{},notes:{},chk:{},soft:{},pitch:{},star:{},beh:{},ask:{}};
let saveT=null;
function lazySave(){clearTimeout(saveT);saveT=setTimeout(save,450);}

function load(){
  try{const r=localStorage.getItem(KEY); if(r) S=Object.assign(S,JSON.parse(r));}catch(e){}
}
function merge(remote){
  if(!remote||typeof remote!=="object") return;
  for(const k of KEYS){
    if(remote[k]&&typeof remote[k]==="object") S[k]=Object.assign({},remote[k],S[k]);
  }
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
}
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtDate=iso=>{const[y,m,d]=iso.split("-");return d+"/"+m;};
function todayIso(){const n=new Date();return n.getFullYear()+"-"+String(n.getMonth()+1).padStart(2,"0")+"-"+String(n.getDate()).padStart(2,"0");}
function currentDay(){
  const t=todayIso();
  const exact=DIAS.find(d=>d.date===t); if(exact) return exact.d;
  if(t<DIAS[0].date) return 1;
  if(t>DIAS[DIAS.length-1].date) return 25;
  return (DIAS.find(d=>d.date>=t)||DIAS[0]).d;
}
let sel=currentDay();
let view="trilha";

/* ---------- render: rail ---------- */
function renderRail(){
  const t=todayIso();
  let h="";
  for(const w of [1,2,3,4]){
    const days=DIAS.filter(d=>d.week===w);
    const done=days.filter(d=>S.done[d.d]).length;
    h+='<div class="week"><div class="week-title"><b>'+WEEKS[w].n+'</b> '+esc(WEEKS[w].t)+
       '<span class="week-count mono">'+done+'/'+days.length+'</span></div><div class="days">';
    for(const d of days){
      const isToday=d.date===t;
      const cls="dot"+(S.done[d.d]?" done":"")+(isToday&&!S.done[d.d]?" today":"")+(d.kind==="sim"?" sim":"");
      h+='<button class="dayrow'+(d.kind==="rest"?" is-rest":"")+'" data-day="'+d.d+'" aria-current="'+(sel===d.d)+'">'+
         '<span class="'+cls+'"></span><span class="num mono">'+fmtDate(d.date)+'</span>'+
         '<span class="lbl">'+esc(d.title)+'</span></button>';
    }
    h+='</div></div>';
  }
  $("#rail").innerHTML=h;
}

    const k=pre+":"+i, on=!!bag[k];
    h+='<li class="'+(on?"checked":"")+'"><input type="checkbox" class="cb" data-'+attr+'="'+k+'"'+(on?" checked":"")+' aria-label="'+esc(e.t)+'">'+
       '<span class="ex-main"><span class="ex-t">'+(e.u?'<a href="'+e.u+'" target="_blank" rel="noopener">'+esc(e.t)+'</a>':esc(e.t))+'</span>';
    const meta=[];
    if(e.s==="lc") meta.push('<span class="src lc">LeetCode</span>');
    if(e.s==="doc") meta.push('<span class="src doc">Leitura</span>');
    if(e.s==="rec") meta.push('<span class="src rec">Gravar</span>');
    if(e.m) meta.push(esc(e.m));
    if(meta.length) h+='<span class="ex-meta">'+meta.join(" ")+'</span>';
    h+='</span></li>';
  });
  return h+'</ul>';
}

/* ---------- render: dia ---------- */
function renderDay(){
  const d=DIAS.find(x=>x.d===sel), t=todayIso();
  const isToday=d.date===t, done=!!S.done[d.d];
  let h='<article class="card"><div class="day-head"><div>';

  h+='<h2>'+esc(d.title)+'</h2>';
  h+='<div style="display:flex;gap:7px;margin-top:9px;flex-wrap:wrap">';

  if(d.timer){

       '<div class="timer"><div class="clock" id="clock">'+String(d.timer).padStart(2,"0")+':00</div>'+

       '</div></section>';

       (d.prio?' <span style="color:var(--muted);font-weight:600">· '+esc(d.prio)+'</span>':'')+
       '</span></div></section>';

    h+='<section class="block"><div class="block-title">Prática de hoje<span class="rule"></span></div>'+
       listHtml(d.ex,"ex",d.d,S.ex)+'</section>';

    h+='<section class="block"><div class="block-title">Responda em voz alta<span class="rule"></span></div><ol class="qs">'+

  const sf=SOFT[d.d];
  if(sf){
    h+='<section class="block"><div class="block-title">Soft skills do dia<span class="rule"></span></div>'+
       '<div class="goal alt"><span aria-hidden="true">🗣</span><div><p class="k">'+esc(sf.t)+'</p><p>'+esc(sf.tag)+'</p></div></div>';
    if(sf.ex&&sf.ex.length) h+=listHtml(sf.ex,"soft",d.d,S.soft);
    if(sf.qs&&sf.qs.length) h+='<ol class="qs" style="margin-top:14px">'+sf.qs.map(q=>'<li>'+esc(q)+'</li>').join("")+'</ol>';

        'Dar um exemplo na mão.','Propor a solução simples primeiro.','Procurar a otimização e dizer por quê.',
        'Analisar a complexidade em voz alta.','Implementar.','Testar com caso vazio, mínimo e repetido.']
        .map(s=>'<li>'+s+'</li>').join("")+'</ol>'+
       '<p style="margin:14px 0 0;color:var(--muted);font-size:.9rem">Frase para treinar: <b style="color:var(--ink)">“Eu faria dessa maneira porque…”</b> — o objetivo é mostrar raciocínio, não código decorado.</p></div>';
  }

/* ---------- timer ---------- */
let timerId=null, endAt=0, remain=0, running=false, timerMin=0;
function paintClock(){
  const el=$("#clock"); if(!el) return;
  const neg=remain<0, a=Math.abs(remain);
  const m=Math.floor(a/60), s=a%60;
  el.textContent=(neg?"-":"")+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  el.className="clock"+(neg?" over":(remain<=60&&running?" warn":""));
}
function stopTimer(){running=false;clearInterval(timerId);timerId=null;const b=$("#tStart");if(b)b.textContent="Iniciar";}
function setTimer(min){stopTimer();timerMin=min;remain=min*60;paintClock();}
function bindTimer(d){
  if(!d.timer) return;
  setTimer(timerMin||d.timer);
  $("#tStart").onclick=()=>{
    if(running){stopTimer();return;}
    running=true;endAt=Date.now()+remain*1000;$("#tStart").textContent="Pausar";
    timerId=setInterval(()=>{remain=Math.round((endAt-Date.now())/1000);paintClock();},250);
    paintClock();
  };
  $("#tReset").onclick=()=>setTimer(timerMin);
  $("#presets").querySelectorAll(".chip").forEach(c=>{
    c.onclick=()=>{
      setTimer(+c.dataset.min);
      $("#presets").querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed",x===c));
    };
  });
}
function bindDay(d){
  $("#doneBtn").onclick=()=>{
    if(S.done[d.d]) delete S.done[d.d]; else S.done[d.d]=1;
    save();render();
  };
  $("#dayPane").querySelectorAll("[data-ex],[data-soft]").forEach(cb=>{
    const soft="soft" in cb.dataset;
    const bag=soft?S.soft:S.ex, k=soft?cb.dataset.soft:cb.dataset.ex;
    cb.onchange=()=>{
      if(cb.checked) bag[k]=1; else delete bag[k];
      cb.closest("li").classList.toggle("checked",cb.checked);
      save();
    };
  });
  const ta=$("#notes"); let nt=null;
  ta.oninput=()=>{
    S.notes[d.d]=ta.value;
    clearTimeout(nt);
    nt=setTimeout(()=>{save();const hi=$("#hint");hi.textContent="salvo";setTimeout(()=>hi.textContent="",1400);},450);
  };
  bindTimer(d);
}

/* ---------- render: soft skills ---------- */
const ALL_BEH = BEH.reduce((a,g)=>a.concat(g.items),[]);

function softKeys(n){const s=SOFT[n];return s&&s.ex?s.ex.map((_,i)=>n+":"+i):[];}
function softDayDone(n){const k=softKeys(n);return k.length>0&&k.every(x=>S.soft[x]);}
function softCount(){return Object.keys(SOFT).filter(n=>softDayDone(+n)).length;}
function words(s){return (String(s||"").trim().match(/\S+/g)||[]).length;}
function starFilled(k){const v=S.star[k]||{};return STAR_F.filter(f=>(v[f[0]]||"").trim()).length;}

/* cronômetro genérico — usado pelo ensaio do pitch e pelo drill */
function makeTimer(clockSel,btnSel,secs,label){
  let id=null,rem=secs,run=false;
  const paint=()=>{
    const el=$(clockSel); if(!el) return;
    const neg=rem<0,a=Math.abs(rem);
    el.textContent=(neg?"-":"")+String(Math.floor(a/60)).padStart(2,"0")+":"+String(a%60).padStart(2,"0");
    el.className="clock"+(neg?" over":(rem<=20&&run?" warn":""));
  };
  const stop=()=>{run=false;clearInterval(id);id=null;const b=$(btnSel);if(b)b.textContent=label;};
  const reset=()=>{stop();rem=secs;paint();};
  const toggle=()=>{
    if(run){stop();return;}
    run=true;const end=Date.now()+rem*1000;const b=$(btnSel);if(b)b.textContent="Pausar";
    id=setInterval(()=>{rem=Math.round((end-Date.now())/1000);paint();},250);
    paint();
  };
  return {paint,stop,reset,toggle};
}
let pitchT=null,drillT=null;
function stopSoftTimers(){if(pitchT)pitchT.stop();if(drillT)drillT.stop();}

function pitchWc(){
  const el=$("#pitchWc"); if(!el) return;
  const n=PITCH.reduce((a,p)=>a+words(S.pitch[p[0]]),0);
  const sec=Math.round(n/140*60);           /* ~140 palavras por minuto falando */
  el.textContent=n?n+" palavras · ≈ "+sec+"s falando em ritmo normal":"Meta: 180 a 220 palavras — cerca de 90 segundos.";
  el.className="wc"+(sec>95?" over":"");
}

function renderSoft(){
  stopSoftTimers();
  const feitos=softCount();
  let h='<div class="soft-head"><div><h2>Soft skills</h2>'+
    '<p>A trilha técnica prova que você resolve o problema. Esta prova que dá para trabalhar com você — e é aqui que a maioria dos processos de júnior é decidida.</p></div>'+
    '<div class="meter"><div class="meter-head"><span>Blocos diários</span><span class="mono">'+feitos+'/25</span></div>'+
    '<div class="bar"><span style="width:'+(feitos/25*100)+'%"></span></div></div></div><div class="stack">';

  /* pitch */
  h+='<div class="panel"><h3>Pitch de 90 segundos</h3>'+
     '<p class="sub">Presente → passado → futuro. Escreva falando: leia cada frase em voz alta antes de passar para a próxima.</p>';
  for(const [k,lab,hint] of PITCH){
    h+='<div class="field"><label for="pi-'+k+'">'+esc(lab)+'</label><p class="hint">'+esc(hint)+'</p>'+
       '<textarea id="pi-'+k+'" data-pitch="'+k+'">'+esc(S.pitch[k]||"")+'</textarea></div>';
  }
  h+='<div class="wc" id="pitchWc"></div>'+
     '<div class="drill-row"><button class="btn primary" id="pStart">Ensaiar 90s</button>'+
     '<button class="btn" id="pReset">Zerar</button><div class="clock" id="pClock">01:30</div></div></div>';

  /* banco de histórias */
  const prontas=STAR.filter(s=>starFilled(s.k)===STAR_F.length).length;
  h+='<div class="panel"><h3>Banco de histórias (STAR)</h3>'+
     '<p class="sub">Oito histórias cobrem quase toda pergunta comportamental. '+
     '<span class="mono">'+prontas+'/'+STAR.length+'</span> prontas.</p>';
  for(const s of STAR){
    const n=starFilled(s.k),full=n===STAR_F.length,v=S.star[s.k]||{};
    h+='<details class="star-item" data-star="'+s.k+'"><summary class="star-sum"><span class="arrow">▶</span>'+
       '<span>'+esc(s.t)+'</span><span class="badge'+(full?" on":"")+'">'+(full?"pronta":n+"/"+STAR_F.length)+'</span></summary>'+
       '<div class="star-body"><p class="hint" style="margin:0 0 12px;font-size:.82rem;color:var(--muted)">'+esc(s.h)+'</p>';
    for(const [f,lab,hint] of STAR_F){
      h+='<div class="field"><label for="st-'+s.k+'-'+f+'">'+esc(lab)+'</label><p class="hint">'+esc(hint)+'</p>'+
         '<textarea id="st-'+s.k+'-'+f+'" data-star-f="'+s.k+'|'+f+'">'+esc(v[f]||"")+'</textarea></div>';
    }
    h+='</div></details>';
  }
  h+='</div>';

  h+='<div class="grid2">';

  /* perguntas + drill */
  h+='<div class="panel"><h3>Perguntas comportamentais</h3>'+
     '<p class="sub">'+ALL_BEH.length+' perguntas. Marque só as que você já respondeu em voz alta, inteiras, sem reler nada.</p>'+
     '<div class="drill"><div class="drill-q idle" id="drillQ">Sorteie uma pergunta, comece a falar em até 5 segundos e não passe de 2 minutos.</div>'+
     '<div class="drill-row"><button class="btn primary" id="dNew">Sortear</button>'+
     '<button class="btn" id="dStart">Iniciar 2 min</button><div class="clock" id="dClock">02:00</div></div></div>';
  for(const g of BEH){
    const on=g.items.filter(i=>S.beh[g.g+"|"+i]).length;
    h+='<p class="qcat">'+esc(g.g)+' <span class="mono">'+on+'/'+g.items.length+'</span></p>';
    for(const i of g.items){
      const k=g.g+"|"+i,c=!!S.beh[k];
      h+='<label class="tick q'+(c?" on":"")+'"><input type="checkbox" class="cb" data-beh="'+esc(k)+'"'+(c?" checked":"")+'><span>'+esc(i)+'</span></label>';
    }
  }
  h+='</div>';

  /* coluna direita */
  const escolhidas=ASK.filter(a=>S.ask[a.q]).length;
  h+='<div class="stack"><div class="panel"><h3>Perguntas para o entrevistador</h3>'+
     '<p class="sub">Escolha 5 e leve anotadas. <span class="mono">'+escolhidas+'/5</span> escolhidas.</p>';
  for(const a of ASK){
    const c=!!S.ask[a.q];
    h+='<label class="tick q'+(c?" on":"")+'"><input type="checkbox" class="cb" data-ask="'+esc(a.q)+'"'+(c?" checked":"")+'>'+
       '<span>'+esc(a.q)+'<span class="askd">'+esc(a.d)+'</span></span></label>';
  }
  h+='</div>';

  h+='<div class="panel"><h3>Regra de ouro da resposta comportamental</h3>'+
     '<p class="sub">Para quando a pergunta pegar você de surpresa.</p><ol class="qs">'+
     ["Repita a pergunta com suas palavras — ganha 3 segundos e evita responder outra coisa.",
      "Escolha uma história do banco. Uma só, não três pela metade.",
      "Situação e Tarefa em duas frases. Contexto longo mata a resposta.",
      "Ação em primeira pessoa do singular: o que VOCÊ fez.",
      "Feche no Resultado, sempre. Sem resultado não é história, é desabafo.",
      "Dois minutos. Se passou disso, o corte começa pela Situação.",
      "Nunca passou por isso? “Nunca aconteceu comigo, mas eu faria assim…” é resposta válida.",
      "Não fale mal de professor, colega ou empresa anterior — nunca sai barato."]
      .map(s=>'<li>'+esc(s)+'</li>').join("")+'</ol></div>';

  h+='</div></div></div>';
  $("#viewSoft").innerHTML=h;
  bindSoft();
}

function bindSoft(){
  const box=$("#viewSoft");

  box.querySelectorAll("[data-pitch]").forEach(ta=>{
    ta.oninput=()=>{S.pitch[ta.dataset.pitch]=ta.value;pitchWc();lazySave();};
  });
  pitchWc();

  box.querySelectorAll("[data-star-f]").forEach(ta=>{
    ta.oninput=()=>{
      const [k,f]=ta.dataset.starF.split("|");
      (S.star[k]=S.star[k]||{})[f]=ta.value;
      const n=starFilled(k),full=n===STAR_F.length;
      const badge=box.querySelector('[data-star="'+k+'"] .badge');
      badge.textContent=full?"pronta":n+"/"+STAR_F.length;
      badge.classList.toggle("on",full);
      lazySave();
    };
  });

  box.querySelectorAll("[data-beh],[data-ask]").forEach(cb=>{
    const ask="ask" in cb.dataset, bag=ask?S.ask:S.beh, k=ask?cb.dataset.ask:cb.dataset.beh;
    cb.onchange=()=>{
      if(cb.checked) bag[k]=1; else delete bag[k];
      cb.closest(".tick").classList.toggle("on",cb.checked);
      save();
    };
  });

  pitchT=makeTimer("#pClock","#pStart",90,"Ensaiar 90s");
  drillT=makeTimer("#dClock","#dStart",120,"Iniciar 2 min");
  $("#pStart").onclick=pitchT.toggle;
  $("#pReset").onclick=pitchT.reset;
  $("#dStart").onclick=drillT.toggle;
  $("#dNew").onclick=()=>{
    const q=$("#drillQ");
    let n=ALL_BEH[Math.floor(Math.random()*ALL_BEH.length)];
    if(n===q.dataset.q) n=ALL_BEH[(ALL_BEH.indexOf(n)+1)%ALL_BEH.length];
    q.dataset.q=n;q.textContent=n;q.className="drill-q";
    drillT.reset();
  };
}

/* ---------- render geral ---------- */
function render(){
  const n=DIAS.filter(d=>S.done[d.d]).length;
  $("#mProg").textContent=n+"/25";
  $("#mBar").style.width=(n/25*100)+"%";
  $("#viewTrilha").hidden=view!=="trilha";

}

/* ---------- PWA: service worker, instalação, backup ---------- */
let deferredPrompt=null;
function toast(msg){
  let t=document.querySelector(".toast");
  if(!t){t=document.createElement("div");t.className="toast";document.body.appendChild(t);}
  t.textContent=msg;t.classList.add("show");
  clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),2200);
}
function netState(){
  const el=$("#sync"),tx=$("#syncTxt");
  if(navigator.onLine){el.classList.remove("off");tx.textContent="progresso salvo neste dispositivo · funciona offline";}
  else{el.classList.add("off");tx.textContent="sem internet — o app continua funcionando";}
}
function initPWA(){
  if("serviceWorker" in navigator){
    window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
  }
  window.addEventListener("beforeinstallprompt",e=>{
    e.preventDefault();deferredPrompt=e;$("#installBtn").hidden=false;
  });
  window.addEventListener("appinstalled",()=>{$("#installBtn").hidden=true;toast("App instalado");});
  $("#installBtn").onclick=async()=>{
    if(!deferredPrompt) return;
    deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;$("#installBtn").hidden=true;
  };
  $("#exportBtn").onclick=()=>{
    const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="treino-entrevistas-"+todayIso()+".json";
    a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
    toast("Backup baixado");
  };
  $("#importBtn").onclick=()=>$("#importFile").click();
  $("#importFile").onchange=async ev=>{
    const f=ev.target.files[0];if(!f)return;
    try{
      const d=JSON.parse(await f.text());
      for(const k of KEYS) if(d[k]&&typeof d[k]==="object") S[k]=Object.assign({},S[k],d[k]);
      save();render();toast("Progresso importado");
    }catch(e){toast("Arquivo inválido");}
    ev.target.value="";
  };
  addEventListener("online",netState);addEventListener("offline",netState);netState();
}

load();
render();
initPWA();
</script>
